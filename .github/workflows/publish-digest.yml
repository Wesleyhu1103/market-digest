name: Publish digest

# Triggers:
#  - push of incoming/new-main.html (the digest agent's only write)
#  - weekday cron to refresh FRED chart data even when no digest lands
#  - manual dispatch for re-runs
on:
  push:
    branches: [main]
    paths: ["incoming/**"]
  schedule:
    - cron: "30 11 * * 1-5" # 7:30am ET weekdays: generate + publish + FRED
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fully automated digest: on cron/manual runs with an ANTHROPIC_API_KEY
      # secret, fetch feeds and generate today's <main> via the Claude API.
      # Push-triggered runs already carry a digest in incoming/, so skip.
      - name: Generate digest with Claude (cron/manual only)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ -f incoming/new-main.html ]; then
            echo "Removing stale incoming/new-main.html before scheduled generation"
            rm incoming/new-main.html
          fi

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::error::ANTHROPIC_API_KEY secret not set; scheduled digest generation cannot run"
              exit 1
            fi
            echo "ANTHROPIC_API_KEY secret not set; skipping generation"
          elif [ -f incoming/new-main.html ]; then
            echo "incoming/new-main.html already present; skipping generation"
          else
            pip install -q anthropic
            python3 scripts/generate_digest.py
          fi

          if [ "$EVENT_NAME" = "schedule" ] && [ ! -f incoming/new-main.html ]; then
            echo "::error::Scheduled digest generation did not produce incoming/new-main.html"
            exit 1
          fi

      - name: Apply incoming digest (archive + repair + splice)
        run: python3 scripts/publish_digest.py

      - name: Refresh FRED chart data
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/update_fred.py

      - name: Validate digest (structure + JS parse)
        run: python3 scripts/validate_digest.py docs/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish digest $(TZ=America/New_York date +%F)"
            git pull --rebase origin main
            git push origin main
          fi

  # Pushes made with GITHUB_TOKEN do not trigger the legacy
  # pages-build-deployment workflow, so deploy explicitly.
  # One-time setup: Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
