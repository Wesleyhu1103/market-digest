name: Publish digest

# Dual-host deploy model (GitHub Pages + Vercel):
#   1. build  — generate/repair digest, validate, commit + push to main
#   2. deploy — upload docs/ to GitHub Pages, then POST VERCEL_DEPLOY_HOOK
# Vercel should rely on the deploy hook (after Pages), not git auto-deploy alone.
# Git auto-deploy can fail silently (e.g. invalid vercel.json cron) or race the hook.
#
# Triggers:
#  - push of incoming/new-main.html (agent upload)
#  - push to main when the live digest date is behind today (catches missed cron / bad merges)
#  - weekday cron (primary + backup; skipped when digest is already current)
#  - digest-watchdog.yml dispatches this workflow when stale during the morning window
#  - manual dispatch
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 11 * * 1-5" # ~7:30am ET weekdays (GitHub cron runs in UTC; often delayed)
    - cron: "30 12 * * 1-5" # ~8:30am ET during EST (Nov–Mar)
    - cron: "30 14 * * 1-5" # ~10:30am ET backup (EDT)
    - cron: "30 15 * * 1-5" # ~10:30am ET backup (EST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-digest
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      stale: ${{ steps.decide.outputs.stale }}
      static: ${{ steps.decide.outputs.static }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether publish pipeline should run
        id: decide
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -f incoming/new-main.html ]; then
              echo "Manual run found incoming/new-main.html; publishing it without regeneration"
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "stale=false" >> "$GITHUB_OUTPUT"
              echo "static=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "static=false" >> "$GITHUB_OUTPUT"
            if python3 scripts/digest_stale.py; then
              echo "Digest already current; skipping manual regeneration"
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "stale=false" >> "$GITHUB_OUTPUT"
            else
              echo "Digest stale; running manual catch-up publish"
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "stale=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$EVENT" = "schedule" ]; then
            echo "static=false" >> "$GITHUB_OUTPUT"
            if python3 scripts/digest_stale.py; then
              echo "Digest already current; skipping scheduled publish"
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "stale=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Digest stale; running scheduled publish"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git diff --name-only "$BEFORE" "$AFTER" | tr '\n' ' ')"
          else
            CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD | tr '\n' ' ')"
          fi
          echo "changed: $CHANGED"
          if echo "$CHANGED" | grep -q 'incoming/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "static=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! python3 scripts/digest_stale.py; then
            echo "Digest is stale; running catch-up publish"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "static=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED" | grep -qE '(^| )(docs/|\.github/workflows/publish-digest\.yml|\.github/workflows/sync-agent-branches\.yml|vercel\.json|api/)'; then
            echo "Static site or publish workflow change — validate and deploy Pages"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "static=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Digest is current; skipping pipeline for this push"
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "static=false" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate digest with Claude
        if: github.event_name != 'push' || needs.plan.outputs.stale == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          STALE: ${{ needs.plan.outputs.stale }}
        run: |
          if [ -f incoming/new-main.html ]; then
            echo "incoming/new-main.html already present; publishing it without generation"
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            if [ "$EVENT_NAME" = "schedule" ] || [ "$STALE" = "true" ]; then
              echo "::error::ANTHROPIC_API_KEY secret not set; cannot generate today's digest"
              exit 1
            fi
            echo "ANTHROPIC_API_KEY secret not set; skipping generation"
          else
            pip install -q anthropic
            python3 scripts/generate_digest.py
          fi

          if { [ "$EVENT_NAME" = "schedule" ] || [ "$STALE" = "true" ]; } && [ ! -f incoming/new-main.html ]; then
            echo "::error::Digest generation did not produce incoming/new-main.html"
            exit 1
          fi

      - name: Apply incoming digest (archive + repair + splice)
        run: python3 scripts/publish_digest.py

      - name: Refresh FRED chart data
        if: needs.plan.outputs.static != 'true'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REQUIRE_FRED_API_KEY: ${{ (github.event_name == 'schedule' || needs.plan.outputs.stale == 'true') && 'true' || '' }}
        run: python3 scripts/update_fred.py

      - name: Validate digest (structure + JS parse)
        run: python3 scripts/validate_digest.py docs/index.html

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish digest $(TZ=America/New_York date +%F)"
            git pull --rebase origin main
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.deploy_sha }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync Vercel production
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK not set — Vercel will not sync after publish."
            exit 1
          fi
          for attempt in 1 2 3; do
            if curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"; then
              echo "Vercel production redeploy triggered (attempt $attempt)"
              exit 0
            fi
            echo "Deploy hook attempt $attempt failed; retrying in 10s…"
            sleep 10
          done
          echo "::error::Vercel deploy hook failed after 3 attempts"
          exit 1
