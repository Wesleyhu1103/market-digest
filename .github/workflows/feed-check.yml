name: Feed check

# On-demand health check for the RSS/Atom feed roster in
# scripts/feed_sources.py. Run it (Actions tab -> Feed check -> Run
# workflow, any branch) after adding or suspecting a feed: agent sandboxes
# often can't reach news CDNs, but Actions runners can, so this is the
# authoritative reachability test. Fails only if EVERY feed is down.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch all configured feeds
        run: python3 scripts/feed_sources.py | tee /tmp/feed-check.txt

      - name: Flag failed feeds on the admin maintenance board
        if: always()
        env:
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          FAILED="$(awk '/ failed / { sub(/ *failed.*/, ""); gsub(/ +$/, ""); print }' /tmp/feed-check.txt | paste -sd'; ' - || true)"
          [ -n "$FAILED" ] || { echo "No failed feeds."; exit 0; }
          DETAIL="$(grep ' failed ' /tmp/feed-check.txt | head -20 || true)"
          python3 scripts/post_maintenance_flag.py \
            --source feed-check --severity warning \
            --dedupe-key "feed-failed" \
            --title "Feed(s) unreachable: ${FAILED}" \
            --detail "${DETAIL}" \
            --url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
