name: Digest watchdog

# GitHub's built-in cron is often delayed 1-2 hours during peak load.
# This lightweight job polls every 15 minutes during the weekday publish
# window and triggers the full publish pipeline while docs/index.html is
# still behind today's date.
#
# Design rules learned the hard way:
#  - Window is 11:00-15:00 UTC (7-11am EDT / 6-10am EST): the digest either
#    publishes in that window or the 13:30 UTC alarm has already fired.
#    Polling into the afternoon added ~12 no-op runs/day whose only effect
#    was more chances for infra noise to paint a red X.
#  - NO concurrency group: each run is an idempotent staleness check, and
#    publish-digest.yml's own concurrency group collapses duplicate
#    dispatches. A group here meant queued runs got cancelled by newer
#    ticks, which GitHub surfaces as red "failure" runs — pure noise
#    (2026-07-24: a queued run was cancelled with the digest long since
#    published and showed as a workflow failure).
#  - Every gh/network call is retried; a transient API blip must not fail a
#    poll. Red means exactly one thing: the digest is genuinely late.
on:
  schedule:
    - cron: "0,15,30,45 11-14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger publish if digest is stale
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if python3 scripts/digest_stale.py; then
            echo "Digest is current; nothing to do."
            exit 0
          fi

          # Retry wrapper: attempt logs go to stderr so callers can capture
          # stdout cleanly through command substitution.
          ghretry() {
            local n
            for n in 1 2 3; do
              if "$@"; then return 0; fi
              echo "attempt ${n}/3 failed: $*" >&2
              sleep $((2 * n))
            done
            return 1
          }

          # Loud alarm: by 13:30 UTC (09:30 EDT / 08:30 EST) both primary
          # paths should have produced a current digest. Re-verify against
          # live main first: the checkout is only a snapshot.
          late_stale_alarm() {
            local detail="$1" error="$2" nowhm
            nowhm="$(date -u +%H%M)"
            if [ "$((10#$nowhm))" -lt 1330 ]; then
              return 0
            fi
            if python3 scripts/digest_stale.py --remote "https://raw.githubusercontent.com/${REPO}/main/docs/index.html"; then
              echo "Digest published since this run started; standing down."
              exit 0
            fi
            python3 scripts/post_maintenance_flag.py \
              --source digest-watchdog --severity critical \
              --dedupe-key "stale-digest-$(date -u +%F)" \
              --title "Digest still stale past 09:30 ET on $(date -u +%F)" \
              --detail "${detail} Checked at ${nowhm} UTC." \
              --url "https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
            echo "::error::${error} Checked at ${nowhm} UTC."
            exit 1
          }

          # Duplicate-dispatch guard. If the check itself keeps failing,
          # dispatch anyway: publish-digest.yml's concurrency group dedupes.
          RUNNING="$(ghretry gh run list --repo "$REPO" \
            --workflow publish-digest.yml --status in_progress --json databaseId \
            --jq 'length' || echo unknown)"
          if [ "$RUNNING" = "unknown" ]; then
            echo "In-progress check failed after retries; proceeding (publish concurrency dedupes)."
            RUNNING=0
          fi
          if [ "$RUNNING" != "0" ]; then
            late_stale_alarm \
              "Digest is stale and publish-digest.yml is already in progress; the publish may be stuck, so no duplicate dispatch was attempted. Check the in-progress publish run and /api/cron-watchdog." \
              "Digest still stale past 09:30 ET while publish-digest.yml is already in progress; check for a stuck publish run."
            echo "Publish digest already in progress; skipping duplicate trigger."
            exit 0
          fi

          echo "Digest is stale; dispatching Publish digest workflow."
          DISPATCHED=1
          ghretry gh workflow run publish-digest.yml --repo "$REPO" --ref main || DISPATCHED=0
          if [ "$DISPATCHED" = "0" ]; then
            echo "::warning::Dispatch failed after 3 attempts; the next 15-minute poll will retry."
          fi

          if [ "$DISPATCHED" = "1" ]; then
            late_stale_alarm \
              "Primary schedulers (GitHub cron + Vercel cron) both lagged; the watchdog dispatched publish. Check /api/cron-watchdog and GITHUB_TOKEN in Vercel." \
              "Digest still stale past 09:30 ET after the watchdog dispatched publish."
          else
            late_stale_alarm \
              "Digest is stale and the watchdog could not dispatch publish-digest.yml after 3 attempts. Check GitHub Actions availability and workflow permissions." \
              "Digest still stale past 09:30 ET and watchdog dispatch failed."
          fi
