name: Digest watchdog

# GitHub's built-in cron is often delayed 1–2 hours during peak load.
# This lightweight job polls every 15 minutes during the weekday publish
# window (US/Eastern morning) and triggers the full publish pipeline only
# while docs/index.html is still behind today's date.
on:
  schedule:
    # 11:00–18:00 UTC Mon–Fri ≈ 7:00am–2:00pm ET (covers EDT and EST)
    - cron: "0 11 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "45 11 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "45 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "45 15 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "15 16 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "45 16 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "15 17 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "45 17 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: digest-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trigger publish if digest is stale
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          if python3 scripts/digest_stale.py; then
            echo "Digest is current; nothing to do."
            exit 0
          fi

          RUNNING="$(gh run list --repo "${{ github.repository }}" \
            --workflow publish-digest.yml --status in_progress --json databaseId \
            --jq 'length')"
          if [ "$RUNNING" != "0" ]; then
            echo "Publish digest already in progress; skipping duplicate trigger."
            exit 0
          fi

          echo "Digest is stale; dispatching Publish digest workflow."
          gh workflow run publish-digest.yml --repo "${{ github.repository }}" --ref main

          # Loud alarm: by ~09:30 ET both primary paths (GitHub cron + Vercel
          # cron) should have published already. Still stale this late means a
          # scheduler silently failed — fail the run so it shows red and pings us,
          # and file a maintenance flag on the admin page.
          NOWHM="$(date -u +%H%M)"
          if [ "$((10#$NOWHM))" -ge 1330 ]; then
            if [ -n "${MAINTENANCE_TOKEN:-}" ]; then
              curl -sS -X POST "https://market-digest-liart.vercel.app/api/maintenance" \
                -H "Content-Type: application/json" \
                -H "x-maintenance-token: ${MAINTENANCE_TOKEN}" \
                -d "{\"source\":\"digest-watchdog\",\"severity\":\"critical\",\"dedupeKey\":\"stale-digest-$(date -u +%F)\",\"title\":\"Digest still stale past 09:30 ET on $(date -u +%F)\",\"detail\":\"Primary schedulers (GitHub cron + Vercel cron) both lagged; backup dispatched publish at ${NOWHM} UTC. Check /api/cron-watchdog and GITHUB_TOKEN in Vercel.\",\"url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
                || echo "maintenance flag POST failed (non-fatal)"
            fi
            echo "::error::Digest still stale at ${NOWHM} UTC (past 09:30 ET). Primary schedulers lagged; backup just dispatched publish. Check the Vercel cron /api/cron-watchdog (it needs GITHUB_TOKEN set in Vercel to dispatch)."
            exit 1
          fi
