name: Maintenance monitors

# Daily sweep that feeds the admin page's Site Maintenance board
# (docs/admin.html -> /api/maintenance). Two checks:
#   1. Open bot PRs (cursor, vercel, dependabot) — surfaces automated
#      bug-investigation output where it gets seen instead of piling up.
#   2. Latest run conclusion of every automation workflow (publish,
#      feedback clustering, watchdog) — a failing pipeline becomes a flag
#      even if nobody watched the Actions tab. process-feedback failed 3
#      straight weeks (2026-07-06..20) with zero in-band signal; this
#      check exists so that class of silent rot cannot recur.
# Requires the MAINTENANCE_TOKEN repo secret (same value as the Vercel env
# var of that name); steps no-op harmlessly when it is unset.
on:
  schedule:
    - cron: "30 18 * * 1-5" # 2:30pm ET weekdays, after the publish window
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mirror open bot PRs as maintenance flags
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --repo "${{ github.repository }}" --state open \
            --json number,title,author,url \
            --jq '.[] | select(.author.login | test("cursor|vercel|dependabot")) | [.number, .author.login, .title, .url] | @tsv' \
          | while IFS=$'\t' read -r NUM AUTHOR TITLE URL; do
              python3 scripts/post_maintenance_flag.py \
                --source bot-prs --severity info \
                --dedupe-key "bot-pr-${NUM}" \
                --title "Open bot PR #${NUM} (${AUTHOR}): ${TITLE}" \
                --detail "An automated agent opened this PR; review, merge, or close it so the queue stays clean." \
                --url "${URL}"
            done
          echo "Bot PR sweep done."

      - name: Flag failed automation runs
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          check() {
            local WF="$1" SEV="$2" WHY="$3" LATEST
            LATEST="$(gh run list --repo "${{ github.repository }}" \
              --workflow "$WF" --limit 1 \
              --json conclusion,url,createdAt \
              --jq '.[0] | [.conclusion // "in_progress", .url, .createdAt] | @tsv' || true)"
            [ -n "$LATEST" ] || { echo "${WF}: no runs found."; return 0; }
            IFS=$'\t' read -r CONCLUSION URL CREATED <<< "$LATEST"
            echo "${WF} latest: ${CONCLUSION} (${CREATED})"
            if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "timed_out" ]; then
              python3 scripts/post_maintenance_flag.py \
                --source workflow-monitor --severity "$SEV" \
                --dedupe-key "wf-failed:${WF}:$(date -u +%F)" \
                --title "Latest '${WF}' run ${CONCLUSION}" \
                --detail "${WHY} (run started ${CREATED})" \
                --url "${URL}"
            fi
          }
          check publish-digest.yml critical \
            "The most recent publish run failed; the site may be serving a stale edition."
          check process-feedback.yml warning \
            "Feedback clustering is failing; reader feedback is not reaching the proposals board."
          check digest-watchdog.yml warning \
            "The stale-digest watchdog's latest run failed. If it was the 09:30 ET alarm the digest was late; otherwise the monitor itself needs attention."
